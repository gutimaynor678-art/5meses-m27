<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#170e24">
<meta name="color-scheme" content="dark">
<title>Para Melania, con todo mi corazón ❤️</title>
<meta property="og:title" content="Para Melania, con todo mi corazón ❤️">
<meta property="og:description" content="Una pequeña sorpresa preparada con mucho amor. Ábrela con calma.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#170e24;--pink:#ff87ad;--rose:#ff4f83;--cream:#fff3e9;--gold:#ffd58a;--muted:#dfcddd;--line:#ffffff22;--serif:'Playfair Display',Georgia,'Times New Roman',serif;--script:'Dancing Script','Segoe Script',cursive,Georgia,serif}
*{box-sizing:border-box}html{min-height:100%;background:var(--bg)}
body{margin:0;min-height:100svh;color:var(--cream);font-family:Georgia,'Times New Roman',serif;background:radial-gradient(ellipse at top,#482247 0%,#21132d 43%,#100b19 100%);overflow-x:hidden}
button,input{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.app{width:min(720px,100%);min-height:100svh;margin:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 15px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;font:700 .75rem system-ui,sans-serif;letter-spacing:.11em;text-transform:uppercase;color:#e8c8db;padding:4px 2px 12px}
.tiny-heart{color:var(--pink);font-size:1.2rem}
.music{border:1px solid #ffffff30;background:#ffffff0c;color:#ffe3ee;border-radius:99px;padding:7px 13px;font:700 .72rem system-ui,sans-serif}
.progress{height:4px;border-radius:99px;overflow:hidden;background:#ffffff15;margin-bottom:15px}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--rose),var(--gold));transition:width .35s ease}
.stage{flex:1;display:flex;align-items:center;justify-content:center;touch-action:pan-y}
.card{width:100%;padding:clamp(22px,6vw,42px) clamp(17px,5vw,36px);text-align:center;border:1px solid var(--line);border-radius:28px;background:linear-gradient(150deg,#ffffff0d,#ffffff05);box-shadow:0 24px 70px #00000025;animation:appear .45s ease both}
.eyebrow{font:700 .73rem/1.6 system-ui,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
h1,h2{font-family:var(--serif)}
h1{font-size:clamp(2.4rem,10vw,4.6rem);line-height:1.02;margin:18px 0;color:#fff3f6;text-shadow:0 0 26px #ff4f8340}
h1 span{display:block;color:var(--pink)}
h2{font-size:clamp(1.7rem,7vw,2.5rem);line-height:1.15;color:#ffd5e1;margin:12px 0 20px}
.body-copy{font-size:clamp(1.05rem,3.7vw,1.2rem);line-height:1.9;color:var(--muted);text-align:left}
.body-copy p{margin:0 0 16px;opacity:0;animation:appear .7s ease forwards}
.body-copy p:nth-child(2){animation-delay:.5s}.body-copy p:nth-child(3){animation-delay:1s}.body-copy p:nth-child(4){animation-delay:1.5s}
.body-copy p:last-child{margin-bottom:0}
.lead{font-size:clamp(1.04rem,3.8vw,1.2rem);line-height:1.8;color:var(--muted);max-width:540px;margin:0 auto}
.ball-scene{height:150px;margin:14px auto 18px;display:grid;place-items:center;position:relative;width:180px}
.ball-scene svg{width:116px;height:116px;animation:bounce 2s ease-in-out infinite;filter:drop-shadow(0 0 22px #ff893b66)}
.float{position:absolute;font-size:25px;animation:float 3s ease-in-out infinite}.f1{top:6px;left:0}.f2{top:2px;right:0;animation-delay:.8s}.f3{bottom:4px;right:12px;animation-delay:1.3s}
.big-heart{font-size:clamp(4rem,18vw,7rem);margin:4px 0 12px;filter:drop-shadow(0 0 17px #ff4f836c);animation:pulse 1.65s ease-in-out infinite}
.month-number{font:700 .8rem system-ui,sans-serif;color:var(--gold);letter-spacing:.18em;text-transform:uppercase}
.month-caption{font-size:1.12rem;line-height:1.8;color:var(--muted);max-width:520px;margin:12px auto 0}
.memory{max-width:520px;margin:16px auto 0;padding:13px 16px;border-left:3px solid var(--pink);background:#ff87ad12;border-radius:0 14px 14px 0;text-align:left;color:#ffe9f1;font-style:italic;line-height:1.7}
.photo{display:block;width:min(260px,70%);aspect-ratio:1;object-fit:cover;margin:16px auto 0;border-radius:18px;border:3px solid #ffffff30;transform:rotate(-2deg)}
.five-dots{display:flex;justify-content:center;gap:9px;margin:21px 0 0}
.dot{width:10px;height:10px;border-radius:50%;background:#ffffff2a}.dot.active{background:var(--pink);box-shadow:0 0 12px #ff4f83}
.counter{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:420px;margin:20px auto 0}
.counter div{padding:10px 4px;border:1px solid #ffffff22;border-radius:14px;background:#ffffff08}
.counter b{display:block;font:700 1.5rem var(--serif);color:var(--pink)}.counter small{font:.68rem system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#cdb8cb}
.quote{font-size:clamp(1.2rem,5vw,1.6rem);line-height:1.75;color:#ffe0a9;margin:20px auto;max-width:540px}
.actions{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:25px}
.btn{border:0;border-radius:999px;padding:14px 22px;min-height:49px;font:700 .96rem/1.3 system-ui,sans-serif;transition:transform .18s}
.btn:active{transform:scale(.97)}.btn:focus-visible,.music:focus-visible,.gate:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.btn-primary{color:#351221;background:linear-gradient(135deg,#ffb2ca,#ff5c8c);box-shadow:0 9px 24px #ff4f8338}
.btn-secondary{color:#f9e9f2;border:1px solid #ffffff36;background:#ffffff09}
.btn-small{font-size:.83rem;min-height:43px;padding:11px 17px}
.gate{width:min(260px,100%);margin:20px auto 0;display:block;padding:13px 16px;text-align:center;font:1.1rem system-ui,sans-serif;color:var(--cream);background:#ffffff0d;border:1px solid #ffffff3a;border-radius:14px}
.err{min-height:1.4em;margin-top:10px;font:.85rem system-ui,sans-serif;color:#ffb3c6}
.footer-note{font:.75rem/1.7 system-ui,sans-serif;color:#bdaabd;text-align:center;margin-top:16px}
.court{height:150px;max-width:400px;width:100%;position:relative;margin:22px auto 10px;border:2px solid #ffb56b8a;border-radius:12px;background:linear-gradient(140deg,#c66a442b,#edaa5820);overflow:hidden}
.court:before{content:"";position:absolute;width:105px;height:105px;border:2px solid #ffb56b8a;border-radius:50%;top:20px;left:calc(50% - 52px)}
.court:after{content:"";position:absolute;top:0;bottom:0;left:50%;border-left:2px solid #ffb56b8a}
.hoop{position:absolute;right:17px;top:57px;width:29px;height:29px;border:4px solid #ff9c60;border-radius:50%;z-index:1}
.reveal{margin:18px 0 0;padding:20px 15px;border:1px solid #ff87ad4f;border-radius:19px;background:#ff87ad0e;text-align:left;animation:appear .55s ease}
.reveal p{font-size:1.08rem;line-height:1.9;color:#f9eaf1}
.signature{font-family:var(--script);color:var(--pink);font-size:1.7rem!important;line-height:1.4!important}
.polaroid{margin:0 auto 22px;width:min(300px,86%);padding:12px 12px 16px;background:#fff7f0;border-radius:6px;box-shadow:0 18px 40px #00000055;transform:rotate(-2.5deg);animation:appear .8s ease both}.polaroid img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;object-position:50% 52%;border-radius:3px;background:#3a2a40}.polaroid figcaption{margin-top:12px;text-align:center;font-family:var(--script);font-size:1.7rem;line-height:1.2;color:#b32e5b}
.confetti-layer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:10}
.confetti-bit{position:absolute;top:-40px;animation:fall linear forwards}
@keyframes appear{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes bounce{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-11px) rotate(6deg)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(-9deg)}50%{transform:translateY(-12px) rotate(9deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}
@media(max-width:380px){.app{padding-left:10px;padding-right:10px}.card{border-radius:22px;padding:23px 15px}.btn{width:100%}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.body-copy p{opacity:1}}
</style>
</head>
<body>
<div id="confetti" class="confetti-layer" aria-hidden="true"></div>
<main class="app">
  <div class="top"><span>Un detalle para Melania</span><span id="topRight" class="tiny-heart">♥</span></div>
  <div class="progress" aria-hidden="true"><div id="progressFill" class="progress-fill"></div></div>
  <div id="stage" class="stage" aria-live="polite"></div>
  <div class="footer-note">27 de octubre de 2026 · Preparado con amor ❤️</div>
</main>

 {kind:'letter',eyebrow:'Una carta para ti · 1 de 4',title:'Mi Melania hermosa…',body:'<p>Felices cinco meses, mi amor. ❤️ No sabes cuánto quisiera abrazarte, mirarte a los ojos y decirte todo esto sin que me falten las palabras. A veces siento tantas cosas por ti que no sé cómo explicarlas, pero hoy quiero intentarlo porque mereces saber lo importante que eres para mí.</p><p>En estos meses hemos vivido momentos bonitos, risas y recuerdos que guardo en mi corazón. También hemos pasado por discusiones y días en que nos costó entendernos. Nuestra historia es real, y por eso valoro tanto lo que estamos construyendo.</p>',button:'Leer la siguiente parte 💌'},
 {kind:'letter',eyebrow:'Una carta para ti · 2 de 4',title:'Quiero amarte cada vez mejor',body:'<p>Sé que amar no es solamente decir “te amo” cuando todo está bonito. También es escuchar, cuidar lo que tenemos y reconocer cuando uno se equivoca. Te pido perdón por las veces que no supe hacerlo bien, y quiero que veas mi amor en mis acciones, en mi sinceridad y en cómo te trato cada día.</p><p>No te prometo que nunca tendremos problemas, porque eso no sería honesto. Quiero aprender a conversar incluso cuando algo nos duela y cuidar la confianza que estamos formando, no solo en este regalo, sino también después de que cierres esta página.</p>',button:'Quiero seguir leyéndote 💗'},
 {kind:'letter',eyebrow:'Una carta para ti · 3 de 4',title:'Mi basquetbolista favorita 🏀',body:'<p>Admiro mucho a la chica que eres. Me encanta que tengas esa pasión por el básquet, que salgas a la cancha y des lo mejor de ti. Quiero verte cumplir tus metas, celebrar tus victorias y animarte cuando un partido no salga como esperabas.</p><p>Quiero que sigas creyendo en ti, que persigas tus sueños y que nunca sientas que tienes que dejar de ser tú para que te amen. Deseo ser alguien que te apoye, que se alegre al verte brillar y que te recuerde lo capaz que eres incluso cuando tú misma lo olvides.</p>',button:'Una última parte de mi carta ❤️'},
 {kind:'letter',eyebrow:'Una carta para ti · 4 de 4',title:'Lo que sueño para nosotros',body:'<p>Cuando imagino el futuro, me ilusiona pensar en lo que todavía nos falta vivir: nuevas experiencias, metas cumplidas, abrazos después de un día cansado y pequeños momentos que se vuelven especiales porque los compartimos. Quiero seguir conociéndote, crecer contigo y construir nuestros sueños paso a paso.</p><p>Gracias por estos cinco meses y por formar parte de mi vida. Te amo por quien eres, por tu fuerza y por esa ternura que te hace ser tú.</p><p>Hoy celebro nuestro aniversario y la oportunidad de seguir creciendo a tu lado. Quiero que algún día recuerdes no solo cuánto te dije que te amaba, sino también las veces que me esforcé por demostrártelo.</p><p class="signature">Con todo mi corazón,<br>tu enamorado. ❤️</p>',button:'Guarda esta carta en tu corazón 💞'},

function counterHTML(){
 if(!CONFIG.START)return '';
 return '<div class="counter" id="counter"><div><b>0</b><small>días</small></div><div><b>0</b><small>horas</small></div><div><b>0</b><small>min</small></div><div><b>0</b><small>seg</small></div></div>';
}
function tick(){
 const c=document.getElementById('counter');if(!c)return;
 const t=new Date(CONFIG.START+'T00:00:00');if(isNaN(t))return;
 let d=Math.max(0,Math.floor((Date.now()-t)/1000));
 const v=[Math.floor(d/86400),Math.floor(d%86400/3600),Math.floor(d%3600/60),d%60];
 c.querySelectorAll('b').forEach((b,i)=>b.textContent=v[i]);
}

function render(){
 clearInterval(timer);
 const s=steps[current];
 progress.style.width=(current/(steps.length-1)*100)+'%';
 let inside='', gate=false;
 if(s.kind==='gate'){gate=true;inside='<div class="eyebrow">Antes de entrar</div><div class="big-heart">🔐</div><h2>Una pregunta solo para ti</h2><p class="lead">¿En qué fecha empezamos, mi amor?</p><input id="gateIn" class="gate" inputmode="numeric" autocomplete="off" placeholder="día / mes" aria-label="Fecha en que empezamos"><div class="err" id="err" role="alert"></div>';}
 else if(s.kind==='cover') inside=`<div class="eyebrow">${s.eyebrow}</div><h1>${s.title}</h1><p class="lead">${s.lead}</p><div class="ball-scene"><span class="float f1">💗</span><span class="float f2">✨</span><span class="float f3">💕</span>${BALL}</div>`;
 else if(s.kind==='text') inside=`<div class="eyebrow">${s.eyebrow}</div><h2>${s.title}</h2><div class="body-copy">${s.body}</div><div class="quote">“Hay regalos que no se compran; se preparan con el corazón.”</div>`;
 else if(s.kind==='month') inside=`<div class="month-number">${s.label}</div><div class="big-heart">${s.heart}</div><h2>${s.title}</h2><p class="month-caption">${s.body}</p>${s.memory?`<div class="memory"></div>`:''}${s.photo?`<img class="photo" alt="Un recuerdo nuestro" src="${s.photo.replace(/"/g,'&quot;')}">`:''}${s.counter?counterHTML():''}<div class="five-dots">${[0,1,2,3,4].map(n=>`<span class="dot ${n===s.n?'active':''}"></span>`).join('')}</div>`;
 else if(s.kind==='letter') inside=`<div class="eyebrow">${s.eyebrow}</div><h2>${s.title}</h2><div class="body-copy">${s.body}</div>`;
 else if(s.kind==='basket') inside=`<div class="eyebrow">${s.eyebrow}</div><h2>${s.title}</h2><p class="lead">${s.body}</p><div class="court"><span class="hoop"></span></div><div class="quote">“Tu fan número uno siempre desea verte brillar.” 💗</div>`;
 else if(s.kind==='final') inside=`<div class="eyebrow">${s.eyebrow}</div><div class="big-heart">💝</div><h2>${s.title}</h2><p class="lead">${s.lead}</p>${revealed?`<div class="reveal">${CONFIG.FINAL_PHOTO?`<figure class="polaroid"><img src="${CONFIG.FINAL_PHOTO.replace(/"/g,'&quot;')}" alt="Melania jugando básquet"><figcaption>Mi basquetbolista favorita 🏀</figcaption></figure>`:''}<p><strong>Melania, ¿sabes cuál es mi equipo favorito?</strong><br>El que formamos cuando nos escuchamos, nos respetamos y jugamos para el mismo lado. No quiero ganar discusiones contigo; quiero que aprendamos a resolverlas juntos.</p><p>Si pudiera pedir algo para nosotros, pediría que sigamos eligiendo conocernos, cuidarnos y crecer juntos. Un mes a la vez, un recuerdo a la vez, un abrazo a la vez.</p><p class="signature">Te amo. Felices 5 meses, mi amor. ❤️🏀</p><p>Y si algún día vuelves a abrir esta página, recuerda que fue preparada pensando en ti, en tu sonrisa y en lo bonito que deseo construir contigo.</p></div>`:''}`;
 const label=s.kind==='final'&&revealed?'Volver al inicio ↻':(s.kind==='gate'?'Entrar 💌':s.button);
 stage.innerHTML=`<article class="card">${inside}<div class="actions">${current>GATE?'<button class="btn btn-secondary btn-small" id="backBtn">← Volver</button>':''}<button class="btn btn-primary" id="nextBtn">${label}</button></div></article>`;
 if(s.memory){stage.querySelector('.memory').textContent=s.memory;}
 document.getElementById('nextBtn').addEventListener('click',nextStep);
 if(current>GATE)document.getElementById('backBtn').addEventListener('click',prevStep);
 if(gate)document.getElementById('gateIn').focus({preventScroll:true});
 else document.getElementById('nextBtn').focus({preventScroll:true});
 if(s.counter&&CONFIG.START){tick();timer=setInterval(tick,1000);}
 save();
}

function nextStep(){
 const s=steps[current];
 if(s.kind==='gate'){
  const v=norm(document.getElementById('gateIn').value);
  if(CONFIG.ANSWERS.some(a=>norm(a)===v)){current++;render();}
  else document.getElementById('err').textContent='Mmm, inténtalo otra vez, mi amor 💗';
  return;
 }
 if(s.kind==='final'){
  if(!revealed){revealed=true;render();celebrate();return;}
  current=GATE;revealed=false;render();return;
 }
 if(current<steps.length-1){current++;render();window.scrollTo({top:0,behavior:'smooth'});}
}
function prevStep(){
 if(current>GATE){
  if(steps[current].kind==='final')revealed=false;
  current--;render();window.scrollTo({top:0,behavior:'smooth'});
 }
}
document.addEventListener('keydown',e=>{
 if(e.target.tagName==='INPUT')return;
 if(e.key==='ArrowRight'&&steps[current].kind!=='final'&&steps[current].kind!=='gate')nextStep();
 if(e.key==='ArrowLeft')prevStep();
});
let x0=null;
stage.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;},{passive:true});
stage.addEventListener('touchend',e=>{
 if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;
 const k=steps[current].kind;if(k==='gate'||Math.abs(dx)<70)return;
 if(dx<0&&k!=='final')nextStep();else if(dx>0)prevStep();
},{passive:true});

function celebrate(){
 const area=document.getElementById('confetti'),emojis=['💗','❤️','💕','✨','🏀','💖'];
 for(let i=0;i<42;i++){const el=document.createElement('span');el.className='confetti-bit';el.textContent=emojis[Math.floor(Math.random()*emojis.length)];el.style.left=Math.random()*100+'%';el.style.animationDuration=(2.6+Math.random()*3.2)+'s';el.style.animationDelay=(Math.random()*.55)+'s';el.style.fontSize=(16+Math.random()*18)+'px';area.appendChild(el);setTimeout(()=>el.remove(),6500);}
}

if(CONFIG.MUSIC_URL){
 const b=document.createElement('button');b.className='music';b.textContent='♪ Nuestra canción';b.setAttribute('aria-pressed','false');
 b.onclick=()=>{
  if(!audio){audio=new Audio(CONFIG.MUSIC_URL);audio.loop=true;}
  if(audio.paused){audio.play().then(()=>{b.textContent='❚❚ Pausar';b.setAttribute('aria-pressed','true');}).catch(()=>{});}
  else{audio.pause();b.textContent='♪ Nuestra canción';b.setAttribute('aria-pressed','false');}
 };
 const r=document.getElementById('topRight');r.replaceWith(b);
}
render();
</script>
</body>
</html>
